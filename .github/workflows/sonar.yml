name: Java build and SonarQube analysis SonarQube Cloud + Java tutorial Page 2
on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{38390d5cb732fbd2f17f892272929ecf17d0da2d}}
run: >
      mvn -B verify
      org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
      -Dsonar.projectKey=Smiley
      -Dsonar.organization=achat
